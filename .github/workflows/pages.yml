name: Deploy VelclawHost at root GitHub Pages URL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout root Pages repository
        uses: actions/checkout@v4

      - name: Checkout VelclawHost application
        uses: actions/checkout@v4
        with:
          repository: Velclaw/VelclawHost
          ref: main
          path: _velclawhost

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install application dependencies
        working-directory: _velclawhost
        run: bun install --frozen-lockfile

      - name: Build application for domain root
        working-directory: _velclawhost
        env:
          GITHUB_PAGES: "false"
        run: bun run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare deployment while preserving existing site and docs
        run: |
          mkdir -p _site/ecosystem _site/content-source
          cp -R site/. _site/ecosystem/
          cp -R content/. _site/content-source/
          cp README.md LICENSE SECURITY.md _site/ 2>/dev/null || true
          cp -R _velclawhost/dist/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
